<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2D1B10">
  <title>Sin conexión — YEIKAR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #2D1B10;
      color: #F9F7F2;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.25rem;
    }
    main { max-width: 26rem; }
    img { width: 96px; height: 96px; margin-bottom: 1.5rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.75rem; }
    p { opacity: 0.85; line-height: 1.6; margin-bottom: 1.75rem; }
    button {
      background: #F9F7F2;
      color: #2D1B10;
      border: none;
      border-radius: 0.5rem;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="/icons/pwa-192.png" alt="YEIKAR" width="96" height="96">
    <h1>Sin conexión — YEIKAR</h1>
    <p>Revisa tu conexión. Tus datos están a salvo en el servidor.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
