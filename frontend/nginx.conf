limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Comprensión gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Service Worker, Workbox y manifiesto: NUNCA cachear (el SW debe
    # actualizarse siempre; un sw.js cacheado deja la app congelada en vieja versión)
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /site.webmanifest {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /index.html {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Iconos PWA sin hash: caché corto (7d) para poder renovarlos sin esperar 1y
    location ^~ /icons/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Caché para assets estáticos con hash en el nombre
    # (excluye sw.js / workbox-*.js / site.webmanifest, que van sin caché arriba)
    location ~* ^(?!/(sw\.js|workbox-.*\.js|site\.webmanifest)$).*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy del backend FastAPI (red interna de compose) — rate/conn limit en el borde
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        limit_conn conn_limit 20;
        client_max_body_size 10M;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback – todas las rutas sirven index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Seguridad básica
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
