services:
  # ──────────────────────────────────────────────────────────────
  # Base de datos PostgreSQL
  # ──────────────────────────────────────────────────────────────
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-yeikar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-yeikar123}
      POSTGRES_DB: ${DB_NAME:-yeikar_db}
    volumes:
      # PG18+: la imagen monta el volumen en /var/lib/postgresql (padre) y
      # guarda los datos en una subcarpeta con la versión (pg_ctlcluster).
      # Montar en /var/lib/postgresql/data (como hacía ≤17) hace que el
      # entrypoint se queje y el contenedor no arranque.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-yeikar} -d ${DB_NAME:-yeikar_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────────
  # Backend FastAPI
  # ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-yeikar}:${DB_PASSWORD:-yeikar123}@db:5432/${DB_NAME:-yeikar_db}
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-false}
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-1200}
      LOGIN_MAX_INTENTOS: ${LOGIN_MAX_INTENTOS:-5}
      LOGIN_VENTANA_MINUTOS: ${LOGIN_VENTANA_MINUTOS:-15}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:80}
      # IP fija de Caddy en la red de compose (ver "networks" al final).
      # Le dice al backend a qué peer confiarle el X-Forwarded-For
      # (rate limit / lockout de login). No ponerla = se ignora XFF.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ──────────────────────────────────────────────────────────────
  # Caddy: ÚNICO punto de entrada público del VPS (80/443).
  # Consigue el certificado TLS solo, según API_DOMAIN en .env.
  #   - API_DOMAIN=api.tudominio.com → HTTPS automático
  #   - API_DOMAIN=:80               → HTTP para pruebas locales
  # ──────────────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      API_DOMAIN: ${API_DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificados TLS
      - caddy_config:/config
    networks:
      default:
        ipv4_address: 10.200.0.10   # IP fija: FORWARDED_ALLOW_IPS debe coincidir
    depends_on:
      backend:
        condition: service_healthy

  # ──────────────────────────────────────────────────────────────
  # Frontend React (nginx)
  # ⚠️ En producción el frontend vive en VERCEL (gratis, CDN). Este
  # servicio queda para uso local/legacy: ya NO publica el puerto 80
  # (lo ocupa Caddy). Solo es alcanzable dentro de la red de compose.
  # ──────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy

  # ──────────────────────────────────────────────────────────────────────────
  # Backup diario de PostgreSQL (pg_dump comprimido + verificación + retención)
  # Activar con: docker compose --profile backup up -d
  # Hora local de Venezuela (3:00 a. m.). El script vive en scripts/backup.sh.
  # Restaurar con: docker compose exec -T db pg_restore -U ${DB_USER:-yeikar} \
  #                -d ${DB_NAME:-yeikar_db} --clean --if-exists \
  #                < backups/yeikar_YYYYMMDD_HHMMSS.dump
  # ──────────────────────────────────────────────────────────────────────────
  backup:
    image: postgres:18-alpine
    profiles: ["backup"]
    restart: unless-stopped
    environment:
      PGUSER: ${DB_USER:-yeikar}
      PGPASSWORD: ${DB_PASSWORD:-yeikar123}
      PGHOST: db
      PGDATABASE: ${DB_NAME:-yeikar_db}
      RETENTION_DAYS: "14"
      TZ: America/Caracas
    volumes:
      - ./backups:/backups:rw
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    # Entrypoint dual: sin argumentos → instala el cron diario y se queda
    # escuchando. Con argumentos (p. ej. `docker compose run --rm backup
    # /bin/sh /usr/local/bin/backup.sh`) → ejecuta el comando y sale
    # (así se fuerza un backup manual).
    entrypoint: >
      /bin/sh -c
      'if [ "$$#" -gt 0 ]; then exec "$$@"; fi;
       echo "0 3 * * * /bin/sh /usr/local/bin/backup.sh >> /backups/backup.log 2>&1" > /etc/crontabs/root;
       exec crond -f -l 2'
    depends_on:
      db:
        condition: service_healthy

  # ──────────────────────────────────────────────────────────────────────────
  # Sincronización offsite: copia ./backups → Cloudflare R2 (cada hora).
  # Anti-ransomware: la copia vive FUERA del VPS, en un bucket con
  # versionado y una credencial de solo escritura. Sin credenciales en
  # .env queda inactivo (solo funciona el backup local).
  # Activar con: docker compose --profile backup up -d offsite-sync
  # ──────────────────────────────────────────────────────────────────────────
  offsite-sync:
    image: rclone/rclone:1.69
    profiles: ["backup"]
    restart: unless-stopped
    environment:
      TZ: America/Caracas
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-yeikar-backups}
      # Config de rclone por variables de entorno (sin rclone.conf en disco)
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Other
      RCLONE_CONFIG_R2_ENDPOINT: https://${R2_ACCOUNT_ID:-}.r2.cloudflarestorage.com
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
    volumes:
      - ./backups:/backups:ro
      - ./scripts/offsite-sync.sh:/usr/local/bin/offsite-sync.sh:ro
    entrypoint: /bin/sh /usr/local/bin/offsite-sync.sh

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

# Red interna con subred fija para poder asignarle a Caddy una IP
# estática (10.200.0.10) y que el backend sepa a quién creerle el
# X-Forwarded-For (anti-spoofing del rate limit).
networks:
  default:
    ipam:
      config:
        - subnet: 10.200.0.0/24
          gateway: 10.200.0.1