services:
  # ──────────────────────────────────────────────────────────────
  # Base de datos PostgreSQL
  # ──────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-yeikar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-yeikar123}
      POSTGRES_DB: ${DB_NAME:-yeikar_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-yeikar} -d ${DB_NAME:-yeikar_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────────
  # Backend FastAPI
  # ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-yeikar}:${DB_PASSWORD:-yeikar123}@db:5432/${DB_NAME:-yeikar_db}
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-false}
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-1200}
      LOGIN_MAX_INTENTOS: ${LOGIN_MAX_INTENTOS:-5}
      LOGIN_VENTANA_MINUTOS: ${LOGIN_VENTANA_MINUTOS:-15}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:80}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ──────────────────────────────────────────────────────────────
  # Frontend React (nginx en producción)
  # ──────────────────────────────────────────────────────────────
  # ⚠️ nginx (:80) es el ÚNICO punto de entrada público. Los puertos
  # :8000 (backend) y :5432 (postgres) ya NO se publican al host;
  # solo son alcanzables desde la red interna de compose.
  # Para HTTPS: pon nginx/certbot (o un proxy como Caddy) delante de :80.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

  # ──────────────────────────────────────────────────────────────────────────
  # Backup diario de PostgreSQL (pg_dump comprimido + retención 14 días)
  # Activar con: docker compose --profile backup up -d
  # Restaurar con: docker compose exec -T db pg_restore -U ${DB_USER:-yeikar} \
  #                -d ${DB_NAME:-yeikar_db} < backups/yeikar_YYYYMMDD_HHMMSS.dump
  # ──────────────────────────────────────────────────────────────────────────
  backup:
    image: postgres:15-alpine
    profiles: ["backup"]
    restart: unless-stopped
    environment:
      PGUSER: ${DB_USER:-yeikar}
      PGPASSWORD: ${DB_PASSWORD:-yeikar123}
      PGHOST: db
      PGDATABASE: ${DB_NAME:-yeikar_db}
      RETENTION_DAYS: "14"
    volumes:
      - ./backups:/backups:rw
    entrypoint: >
      /bin/sh -c
      "echo '0 3 * * * pg_dump -Fc -Z 9 -f /backups/yeikar_`date +\%Y\%m\%d_\%H\%M\%S`.dump && find /backups -name 'yeikar_*.dump' -mtime +\$${RETENTION_DAYS} -delete' > /etc/crontabs/root && crond -f -l 2"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: